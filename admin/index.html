  <style>
    .decap-auth-note {
      position: fixed;
      inset: auto 1rem 1rem auto;
      z-index: 2147483647;
      max-width: 24rem;
      padding: 0.85rem 1rem;
      border: 1px solid #d8dee4;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 30px rgba(27, 31, 36, 0.14);
      color: #24292f;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .decap-auth-note strong {
      display: block;
      margin-bottom: 0.25rem;
    }

    .decap-auth-note a {
      color: #0969da;
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .decap-auth-note {
        right: 0.75rem;
        bottom: 0.75rem;
        left: 0.75rem;
        max-width: none;
      }
    }
  </style>
</head>

    If login opens <code>api.netlify.com/auth</code> and says “not found,” configure a Decap GitHub OAuth proxy first.
    <a href="/admin/auth-setup.html">Read setup notes</a>.
  </aside>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
