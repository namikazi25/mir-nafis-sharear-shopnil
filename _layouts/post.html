---
layout: default
---
<article class="post-page shell">
  <header class="post-header">
    <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags and page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-sub">{{ page.description }}</p>{% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← Back to blog</a></p>
</article>
