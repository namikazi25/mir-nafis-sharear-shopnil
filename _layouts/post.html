---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title | escape }}</h1>
    <p class="detail">{{ page.date | date: '%B %-d, %Y' }}{% if page.tags.size > 0 %} · {{ page.tags | join: ', ' | escape }}{% endif %}</p>
    {% if page.description %}<p>{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="post-content">{{ content }}</div>
  <p><a href="{{ '/blog/' | relative_url }}">← All writing</a></p>
</article>
